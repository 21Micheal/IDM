# Lightweight configuration for Procurement/Forms-only deployment
# Excludes OCR workers and Office preview generation to reduce resource usage
# Keeps document viewer for viewing supplier invoices (PDFs)

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: idm_db
      MYSQL_USER: idm_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-idm_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "idm_user", "-p${DB_PASSWORD:-idm_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && daphne IDM.asgi:application -b 0.0.0.0 -p 8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-insecure-dev-secret-change-me}
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - NGROK_URL=${NGROK_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,nginx},.ngrok-free.dev
      - TZ=Africa/Nairobi
      # ── SunSystems Connect ──────────────────────────────────────────────────
      - SUNSYSTEMS_BASE_URL=${SUNSYSTEMS_BASE_URL:-}
      - SUNSYSTEMS_USERNAME=${SUNSYSTEMS_USERNAME:-}
      - SUNSYSTEMS_PASSWORD=${SUNSYSTEMS_PASSWORD:-}
      - SUNSYSTEMS_BUSINESS_UNIT=${SUNSYSTEMS_BUSINESS_UNIT:-}
      - SUNSYSTEMS_BUDGET_CODE=${SUNSYSTEMS_BUDGET_CODE:-A}
      - SUNSYSTEMS_VERIFY_TLS=${SUNSYSTEMS_VERIFY_TLS:-true}
      # ── Procurement deployment mode ────────────────────────────────────────
      - DEPLOYMENT_MODE=procurement
    volumes:
      - .:/app
      - media_files:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  # Celery worker for general tasks (indexing, notifications)
  # OCR and preview queues excluded for lightweight deployment
  celery_worker:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: celery -A IDM worker -l info -Q default,indexing,notifications
    environment:
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - DJANGO_SETTINGS_MODULE=IDM.settings
      - TZ=Africa/Nairobi
      - DEPLOYMENT_MODE=procurement
    volumes:
      - .:/app
      - media_files:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  celery_beat:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: celery -A IDM beat -l info
    environment:
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - DJANGO_SETTINGS_MODULE=IDM.settings
      - TZ=Africa/Nairobi
      - DEPLOYMENT_MODE=procurement
    volumes:
      - .:/app
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      target: development
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  es_data:
  media_files:
