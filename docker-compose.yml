services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: idm_db
      MYSQL_USER: idm_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-idm_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "idm_user", "-p${DB_PASSWORD:-idm_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && daphne IDM.asgi:application -b 0.0.0.0 -p 8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-insecure-dev-secret-change-me}
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - NGROK_URL=${NGROK_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend,nginx},.ngrok-free.dev
    volumes:
      - .:/app
      - media_files:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  celery_worker:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: celery -A IDM worker -l info -Q default,indexing,notifications,ocr
    environment:
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - DJANGO_SETTINGS_MODULE=IDM.settings
    volumes:
      - .:/app
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  # ── OCR worker — PaddleOCR (default) + Tesseract fallback + spaCy NER ──────
  #
  # PaddleOCR runs entirely on CPU here (-c 2 = 2 concurrent tasks).
  # For GPU-accelerated OCR: set OCR_PADDLE_USE_GPU=true and ensure the
  # host has CUDA drivers + nvidia-docker runtime configured.
  #
  # spaCy NER uses en_core_web_sm (8 MB, pre-downloaded in the Dockerfile).
  # For higher accuracy at the cost of ~800 MB RAM, set:
  #   OCR_SPACY_MODEL=en_core_web_lg
  # and add the download step to your Dockerfile:
  #   RUN python -m spacy download en_core_web_lg
  celery_ocr:
    build:
      context: .
      network: host
    restart: unless-stopped
    # Concurrency 2 — PaddleOCR is thread-safe. Raise to 4 on a machine with
    # ≥8 GB RAM and no GPU to saturate CPU cores across multiple documents.
    command: celery -A IDM worker -Q ocr -c 2 --loglevel=info
    environment:
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - DJANGO_SETTINGS_MODULE=IDM.settings

      # ── OCR engine selection ──────────────────────────────────────────────
      # Options: "paddle" (default) | "tesseract" | "textract"
      - OCR_ENGINE=${OCR_ENGINE:-paddle}

      # ── PaddleOCR settings ────────────────────────────────────────────────
      # Language: "en" covers English + common East African business text.
      # For Arabic, set OCR_PADDLE_LANG=ar; for Chinese, set OCR_PADDLE_LANG=ch.
      - OCR_PADDLE_LANG=${OCR_PADDLE_LANG:-en}
      # Set to "true" only if you have CUDA + nvidia-docker configured.
      - OCR_PADDLE_USE_GPU=${OCR_PADDLE_USE_GPU:-false}
      # Direction classifier — corrects upside-down / rotated text. Keep true.
      - OCR_PADDLE_USE_ANGLE_CLS=${OCR_PADDLE_USE_ANGLE_CLS:-true}

      # ── Tesseract settings (used when OCR_ENGINE=tesseract or as fallback) ─
      - OCR_LANGUAGES=${OCR_LANGUAGES:-eng}

      # ── Common OCR settings ───────────────────────────────────────────────
      - OCR_DPI=${OCR_DPI:-300}
      - OCR_CONFIDENCE_THRESHOLD=${OCR_CONFIDENCE_THRESHOLD:-40}
      - OCR_QUALITY_RATIO=${OCR_QUALITY_RATIO:-0.50}

      # ── spaCy NER settings ────────────────────────────────────────────────
      # Disable NER by setting OCR_SPACY_ENABLED=false (e.g. for low-RAM hosts).
      - OCR_SPACY_ENABLED=${OCR_SPACY_ENABLED:-true}
      # "en_core_web_sm" — 8 MB, fast, good enough for supplier/date/amount NER.
      # "en_core_web_lg" — 560 MB, significantly better on ambiguous text.
      # "en_core_web_trf" — transformer-based, best accuracy, requires ~2 GB RAM.
      - OCR_SPACY_MODEL=${OCR_SPACY_MODEL:-en_core_web_sm}
    volumes:
      - .:/app
      - media_files:/app/media
      # Cache PaddleOCR models between container restarts to avoid re-downloading
      # the ~8 MB PP-OCRv4 detection/recognition models on every deploy.
      - paddle_models:/root/.paddleocr
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  celery_preview:
    build:
      context: .
      network: host
    restart: unless-stopped
    command: celery -A IDM worker -Q preview -c 1 --loglevel=info
    environment:
      - DATABASE_URL=mysql://idm_user:${DB_PASSWORD:-idm_password}@db:3306/idm_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MEDIA_ROOT=/app/media
      - DJANGO_SETTINGS_MODULE=IDM.settings
      - LIBREOFFICE_TIMEOUT=120
    volumes:
      - .:/app
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      target: development
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  es_data:
  media_files:
  # Named volume for PaddleOCR model cache — avoids re-downloading (~8 MB)
  # PP-OCRv4 detection + recognition + direction models on every container restart.
  paddle_models: