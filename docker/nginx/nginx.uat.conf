# Edge reverse proxy for the UAT stack.
# Serves the built SPA as static files and proxies the API / websockets /
# Django static / uploaded media. Everything is same-origin, so the browser
# makes no cross-origin requests and no CORS headers are required.

server {
    listen 80;
    server_name _;

    # Invoices / contracts can be large — keep in step with Django + the dev proxy.
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 300s;
    }

    # ── WebSocket (chat / live workflow updates) ─────────────────────────────
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Django static (admin, DRF browsable API) — served by WhiteNoise ──────
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # ── Uploaded documents — served straight from the shared volume ──────────
    location /media/ {
        alias /app/media/;
        add_header Accept-Ranges bytes;
        expires 1h;
        add_header Cache-Control "private";
        default_type application/octet-stream;
        types {
            application/pdf                                                          pdf;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document  docx;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet        xlsx;
            application/msword                                                       doc;
            application/vnd.ms-excel                                                 xls;
            image/png                                                                png;
            image/jpeg                                                               jpg jpeg;
        }
    }

    # ── SPA — client-side routing falls back to index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
