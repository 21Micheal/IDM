# Edge reverse proxy for the UAT stack.
# Serves the built SPA as static files and proxies the API / websockets /
# Django static / uploaded media. Everything is same-origin, so the browser
# makes no cross-origin requests and no CORS headers are required.

server {
    listen 80;
    server_name _;

    # Invoices / contracts can be large — keep in step with Django + the dev proxy.
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend via Docker's embedded DNS at request time (not just at
    # startup). Using a variable in proxy_pass forces re-resolution, so nginx
    # follows the backend container to its new IP after a rebuild/recreate
    # instead of caching a dead address and returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_read_timeout 300s;
    }

    # ── WebSocket (chat / live workflow updates) ─────────────────────────────
    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Django static (admin, DRF browsable API) — served by WhiteNoise ──────
    location /static/ {
        proxy_pass $backend;
    }

    # ── Uploaded documents — served straight from the shared volume ──────────
    location /media/ {
        alias /app/media/;
        add_header Accept-Ranges bytes;
        expires 1h;
        add_header Cache-Control "private";
        default_type application/octet-stream;
        types {
            application/pdf                                                          pdf;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document  docx;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet        xlsx;
            application/msword                                                       doc;
            application/vnd.ms-excel                                                 xls;
            image/png                                                                png;
            image/jpeg                                                               jpg jpeg;
        }
    }

    # ── ES module assets (PDF.js worker etc.) ────────────────────────────────
    # nginx's default mime.types has no .mjs mapping, so these would be served
    # as application/octet-stream — and browsers refuse to load a module worker
    # with a non-JS MIME type, breaking every PDF preview. Force a JS type.
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # ── SPA — client-side routing falls back to index.html ───────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
