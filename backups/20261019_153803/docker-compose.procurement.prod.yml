# Standalone production-style Compose stack for the procurement/forms deployment.
# PostgreSQL is the only database. No OCR or Office-preview workers are started.
#
# Prepare .env from .env.procurement.example, then run:
#   docker compose -p idm --env-file .env -f docker-compose.procurement.prod.yml up -d --build

x-procurement-app: &procurement-app
  build:
    context: .
    dockerfile: Dockerfile
  image: idm-procurement:prod
  restart: unless-stopped
  env_file:
    - .env
  environment:
    DEBUG: "False"
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    SECURE_SSL: ${SECURE_SSL:-False}
    DB_ENGINE: postgres
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: idm_db
    DB_USER: idm_user
    DB_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    DATABASE_URL: ""
    REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
    ELASTICSEARCH_URL: http://elasticsearch:9200
    MEDIA_ROOT: /app/media
    DJANGO_SETTINGS_MODULE: IDM.settings
    DEPLOYMENT_MODE: procurement
    TZ: Africa/Nairobi
  volumes:
    - media_files:/app/media
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: idm_db
      POSTGRES_USER: idm_user
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idm_user -d idm_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data

  backend:
    <<: *procurement-app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne IDM.asgi:application -b 0.0.0.0 -p 8000"
    expose:
      - "8000"

  celery_worker:
    <<: *procurement-app
    command: celery -A IDM worker -l info -Q default,indexing,notifications

  celery_beat:
    <<: *procurement-app
    command: celery -A IDM beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      celery_worker:
        condition: service_started

  frontend_build:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
      args:
        VITE_API_URL: ""
    image: idm-procurement-frontend:prod
    command: sh -c "rm -rf /out/* && cp -a /app/dist/. /out/"
    volumes:
      - spa_static:/out
    restart: "no"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.uat.conf:/etc/nginx/conf.d/default.conf:ro
      - spa_static:/usr/share/nginx/html:ro
      - media_files:/app/media:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
      frontend_build:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  es_data:
  media_files:
  spa_static:
