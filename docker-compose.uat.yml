# ──────────────────────────────────────────────────────────────────────────────
# UAT / internal-staging compose for the IDM document management system.
#
# Hardened relative to docker-compose.yml (the dev stack):
#   • DEBUG=False, real generated SECRET_KEY, secrets from .env.uat (not the file).
#   • Frontend is a *built* static bundle served by the edge nginx (no Vite dev
#     server). The whole app is therefore SAME-ORIGIN → no CORS/CSRF juggling.
#   • db / redis / elasticsearch are NOT published to the host — internal only.
#   • Only nginx publishes a port (80).
#   • No source bind-mounts: images are immutable; rebuild to ship changes.
#
# Run it (from the project root, on the server):
#   docker compose --env-file .env.uat -f docker-compose.uat.yml up -d --build
#
# The --env-file flag feeds ${...} interpolation below AND the per-service
# env_file injects the same values into the containers at runtime.
# ──────────────────────────────────────────────────────────────────────────────

# Shared definition for the Django app image (backend + every celery worker).
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: idm-app:uat
  restart: unless-stopped
  env_file:
    - .env.uat
  environment:
    DJANGO_SETTINGS_MODULE: IDM.settings
    DATABASE_URL: mysql://idm_user:${DB_PASSWORD}@db:3306/idm_db
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ELASTICSEARCH_URL: http://elasticsearch:9200
    MEDIA_ROOT: /app/media
  volumes:
    - media_files:/app/media
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticsearch:
      condition: service_started

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: idm_db
      MYSQL_USER: idm_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "idm_user", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ── Django (ASGI via Daphne) ─────────────────────────────────────────────────
  backend:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne IDM.asgi:application -b 0.0.0.0 -p 8000"
    # No host port: only the edge nginx talks to it, over the compose network.
    expose:
      - "8000"

  celery_worker:
    <<: *app
    command: celery -A IDM worker -l info -Q default,indexing,notifications

  celery_beat:
    <<: *app
    command: celery -A IDM beat -l info

  celery_ocr:
    <<: *app
    command: celery -A IDM worker -Q ocr -c 2 --loglevel=info
    volumes:
      - media_files:/app/media
      - paddle_models:/root/.paddleocr

  celery_preview:
    <<: *app
    command: celery -A IDM worker -Q preview -c 1 --loglevel=info
    # Reuse a warm LibreOffice profile (persisted in a volume) so Office→PDF
    # previews skip first-run init on every conversion. Re-declares the shared
    # app env because a service-level `environment` replaces the anchor's.
    environment:
      DJANGO_SETTINGS_MODULE: IDM.settings
      DATABASE_URL: mysql://idm_user:${DB_PASSWORD}@db:3306/idm_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MEDIA_ROOT: /app/media
      LIBREOFFICE_PROFILE_DIR: /var/cache/lo-preview
    volumes:
      - media_files:/app/media
      - lo_preview_profile:/var/cache/lo-preview

  # ── Build the SPA once into a shared volume, then exit ───────────────────────
  frontend_build:
    build:
      context: ./frontend
      target: builder            # runs `npm run build` → /app/dist
      args:
        VITE_API_URL: ""         # same-origin: SPA calls a relative /api/v1
    image: idm-frontend-build:uat
    command: sh -c "rm -rf /out/* && cp -a /app/dist/. /out/"
    volumes:
      - spa_static:/out

  # ── Edge: serves the SPA + reverse-proxies /api, /ws, /static, /media ────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.uat.conf:/etc/nginx/conf.d/default.conf:ro
      - spa_static:/usr/share/nginx/html:ro
      - media_files:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
      frontend_build:
        condition: service_completed_successfully

volumes:
  mysql_data:
  redis_data:
  es_data:
  media_files:
  paddle_models:
  spa_static:
  lo_preview_profile:
