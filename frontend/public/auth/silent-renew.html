<!doctype html>
<html>
  <head><title>Silent OIDC renew</title></head>
  <body>
    <!--
      This page is loaded in a hidden iframe by oidc-client-ts to silently
      renew the Keycloak session without user interaction (SSO detection).
      It MUST be served at the URL matching `silent_redirect_uri` in oidcClient.ts.
      Using the CDN UMD build so this static page has no Vite build dependency.
    -->
    <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3/dist/browser/oidc-client-ts.min.js"></script>
    <script>
      new oidc.UserManager({}).signinSilentCallback()
        .catch(function(err) { console.warn("Silent renew callback error:", err); });
    </script>
  </body>
</html>
