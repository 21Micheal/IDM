<!DOCTYPE html>
<html>
<head>
  <title>Silent Renew</title>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@2.2.0/dist/oidc-client-ts.min.js"></script>
  <script>
    var userManager = new Oidc.UserManager({
      authority: 'http://localhost:8080/realms/idp-dev',
      client_id: 'dms-client',
      redirect_uri: window.location.origin + '/auth/callback',
      silent_redirect_uri: window.location.origin + '/auth/silent-renew.html',
      post_logout_redirect_uri: window.location.origin + '/login',
      response_type: 'code',
      scope: 'openid profile email roles',
      automaticSilentRenew: false,
    });
    userManager.signinSilentCallback().then(function () {
      console.log('Silent renew successful');
    }).catch(function (err) {
      console.error('Silent renew failed', err);
    });
  </script>
</body>
</html>
